name: DB Schema Guard

# DB 스키마를 바꿨는데 version 을 안 올렸거나 스냅샷을 커밋 안 한 실수를 CI에서 잡는다.
# 원리: KSP로 스키마를 다시 export → 커밋된 schemas/ 스냅샷과 달라지면 빌드 실패.
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      # :app 이 google-services 플러그인을 적용하므로, 설정 단계에서 걸리지 않게 dev json 주입
      - name: Decode google-services.json (dev)
        env:
          GS_DEV: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
        run: |
          mkdir -p app/src/debug
          echo "$GS_DEV" | base64 -d > app/src/debug/google-services.json

      # KSP가 @Database 를 처리하며 schemas/ 스냅샷을 다시 만든다.
      - name: Generate Room schema
        run: ./gradlew :core:local:kspDebugKotlin

      # 재생성된 스냅샷이 커밋된 것과 다르면(수정/신규) → 실수로 간주하고 실패.
      - name: Verify schema is committed & in sync
        run: |
          CHANGES="$(git status --porcelain -- '*/schemas/*')"
          if [ -n "$CHANGES" ]; then
            echo "::error::Room 스키마가 커밋된 스냅샷과 다릅니다. AppDatabase.version 을 올리고 Migration 을 작성한 뒤 schemas/ 를 커밋하세요."
            echo "$CHANGES"
            git --no-pager diff -- '*/schemas/*' || true
            exit 1
          fi
          echo "✓ Room 스키마가 최신 상태로 커밋되어 있습니다."
